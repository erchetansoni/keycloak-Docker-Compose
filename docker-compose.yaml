x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "${LOG_MAX_SIZE:-10m}"
      max-file: "${LOG_MAX_FILE:-5}"

networks:
  keycloak_network:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    <<: *default-logging
    image: docker.io/postgres:18.6-alpine3.24
    container_name: keycloak_postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-keycloak}"
      POSTGRES_USER: "${POSTGRES_user:-keycloak}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - keycloak_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    <<: *default-logging
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    command: start-dev
    volumes:
      - ./conf/keycloak.conf:/opt/keycloak/conf/keycloak.conf:ro
      - ./logs:/opt/keycloak/data/log
    environment:
      # Initial Admin Credentials
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - keycloak_network
    restart: unless-stopped

  httpd:
    <<: *default-logging
    image: httpd:2.4-alpine
    container_name: test_httpd
    networks:
      - keycloak_network
    restart: unless-stopped

  oauth2-proxy:
    <<: *default-logging
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    container_name: test_oauth2_proxy
    ports:
      - "4180:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://localhost:8080/realms/demo
      OAUTH2_PROXY_LOGIN_URL: http://localhost:8080/realms/demo/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/demo/protocol/openid-connect/token
      OAUTH2_PROXY_VALIDATE_URL: http://keycloak:8080/realms/demo/protocol/openid-connect/userinfo
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/demo/protocol/openid-connect/certs
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_CLIENT_ID: demo-app
      OAUTH2_PROXY_CLIENT_SECRET: demo-secret
      OAUTH2_PROXY_COOKIE_SECRET: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      OAUTH2_PROXY_UPSTREAMS: http://httpd:80
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:4180/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_OIDC_EXTRA_AUDIENCE: "account"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      httpd:
        condition: service_started
    networks:
      - keycloak_network
    restart: unless-stopped
