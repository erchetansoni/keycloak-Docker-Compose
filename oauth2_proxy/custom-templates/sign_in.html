<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Corporate Access Gateway</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0f172a;
            color: #fff;
            margin: 0;
        }

        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Enterprise Portal Login</h2>
        <p>Please authenticate using your Corporate Keycloak ID.</p>
        <a class="btn" href="{{.ProxyPrefix}}/start?rd={{.Redirect}}">Login with SSO</a>
    </div>
</body>

</html>
