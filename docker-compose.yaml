x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "${LOG_MAX_SIZE:-10m}"
      max-file: "${LOG_MAX_FILE:-5}"

networks:
  keycloak_network:
    driver: bridge

volumes:
  postgres_data:

services:
  traefik:
    <<: *default-logging
    image: traefik:v3.7.16
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certs:ro
    networks:
      - keycloak_network
    labels:
      - "traefik.enable=true"
      # Dashboard Router (HTTPS)
      - "traefik.http.routers.traefik-dashboard.rule=Host(`proxy.chetan.com`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

  postgres:
    <<: *default-logging
    image: docker.io/postgres:18.6-alpine3.24
    container_name: keycloak_postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-keycloak}"
      POSTGRES_USER: "${POSTGRES_USER:-keycloak}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - keycloak_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    <<: *default-logging
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    command: start
    volumes:
      - ./conf/keycloak.conf:/opt/keycloak/conf/keycloak.conf:ro
      - ./logs:/opt/keycloak/data/log
    environment:
      # Initial Admin Credentials
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - keycloak_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Keycloak Router (HTTPS)
      - "traefik.http.routers.keycloak.rule=Host(`auth.chetan.com`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  httpd:
    <<: *default-logging
    image: httpd:2.4-alpine
    container_name: test_httpd
    networks:
      - keycloak_network
    restart: unless-stopped

  oauth2-proxy:
    <<: *default-logging
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    container_name: test_oauth2_proxy
    environment:
      OAUTH2_PROXY_PROVIDER: "${OAUTH2_PROXY_PROVIDER:-keycloak-oidc}"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "${OAUTH2_PROXY_OIDC_ISSUER_URL:-https://auth.chetan.com/realms/corp}"
      OAUTH2_PROXY_LOGIN_URL: "${OAUTH2_PROXY_LOGIN_URL:-https://auth.chetan.com/realms/corp/protocol/openid-connect/auth}"
      OAUTH2_PROXY_REDEEM_URL: "${OAUTH2_PROXY_REDEEM_URL:-http://keycloak:8080/realms/corp/protocol/openid-connect/token}"
      OAUTH2_PROXY_VALIDATE_URL: "${OAUTH2_PROXY_VALIDATE_URL:-http://keycloak:8080/realms/corp/protocol/openid-connect/userinfo}"
      OAUTH2_PROXY_OIDC_JWKS_URL: "${OAUTH2_PROXY_OIDC_JWKS_URL:-http://keycloak:8080/realms/corp/protocol/openid-connect/certs}"
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "${OAUTH2_PROXY_SKIP_OIDC_DISCOVERY:-true}"
      OAUTH2_PROXY_CLIENT_ID: "${OAUTH2_PROXY_CLIENT_ID:-portal-web-gateway}"
      OAUTH2_PROXY_CLIENT_SECRET: "${OAUTH2_PROXY_CLIENT_SECRET:-portal-gateway-secret-2026}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}"
      OAUTH2_PROXY_UPSTREAMS: "${OAUTH2_PROXY_UPSTREAMS:-http://httpd:80}"
      OAUTH2_PROXY_HTTP_ADDRESS: "${OAUTH2_PROXY_HTTP_ADDRESS:-0.0.0.0:4180}"
      OAUTH2_PROXY_REDIRECT_URL: "${OAUTH2_PROXY_REDIRECT_URL:-https://app.chetan.com/oauth2/callback}"
      OAUTH2_PROXY_EMAIL_DOMAINS: "${OAUTH2_PROXY_EMAIL_DOMAINS:-*}"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "${OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL:-true}"
      OAUTH2_PROXY_COOKIE_SECURE: "${OAUTH2_PROXY_COOKIE_SECURE:-true}"
      OAUTH2_PROXY_REVERSE_PROXY: "${OAUTH2_PROXY_REVERSE_PROXY:-true}"
      OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      httpd:
        condition: service_started
    networks:
      - keycloak_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # App Router (HTTPS via OAuth2-Proxy)
      - "traefik.http.routers.app.rule=Host(`app.chetan.com`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.services.app.loadbalancer.server.port=4180"
